
services:
  verdaccio:
    image: verdaccio/verdaccio:6
    ports:
      - "4873:4873"
    volumes:
      - verdaccio-storage:/verdaccio/storage
      - ./verdaccio/conf:/verdaccio/conf
    networks:
      - experiment

  npm115:
    build:
      context: .
      args:
        NPM_VERSION: "11.15.0"
    image: npm-paper:11.15.0
    pull_policy: build
    depends_on:
      - verdaccio
    networks:
      - experiment
    command: ["sleep", "infinity"]

  npm116:
    build:
      context: .
      args:
        NPM_VERSION: "11.16.0"
    image: npm-paper:11.16.0
    pull_policy: build
    depends_on:
      - verdaccio
    networks:
      - experiment
    command: ["sleep", "infinity"]

  npm121:
    build:
      context: .
      args:
        NPM_VERSION: "12.1.0"
    image: npm-paper:12.1.0
    pull_policy: build
    depends_on:
      - verdaccio
    networks:
      - experiment
    command: ["sleep", "infinity"]

networks:
  experiment:
    driver: bridge

volumes:
  verdaccio-storage:
